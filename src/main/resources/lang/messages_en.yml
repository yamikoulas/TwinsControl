prefix: "<gradient:#B499DD:#A66AFF>ᴛᴡɪɴѕ ᴄᴏɴᴛʀᴏʟ</gradient> &8» "

# Live BossBar Settings
bossbar:
  title: "&c&lUNDER INSPECTION"
  time-format: "&7[%time%]"

# Live ActionBar Notification
actionbar:
  message: "&eTime: &f%time% &8| &cContact staff on Discord!"

# Player Notifications
player-notifications:
  control-title:
    title: "&#B499DD&lꜰʀᴏᴢᴇɴ"
    subtitle: "&fʏᴏᴜ ʜᴀᴠᴇ ʙᴇᴇɴ ꜰʀᴏᴢᴇɴ ꜰᴏʀ ѕᴜѕᴘᴇᴄᴛᴇᴅ ᴄʜᴇᴀᴛɪɴɢ"
    fade-in: 10
    stay: 100
    fade-out: 20
  
  control-messages:
    - "&7----------------------------------------"
    - "&e⚠ &cᴄʜᴇᴀᴛ ɪɴѕᴘᴇᴄᴛɪᴏɴ ѕᴛᴀʀᴛᴇᴅ"
    - ""
    - "&cʏᴏᴜ ʜᴀᴠᴇ ʙᴇᴇɴ ꜰʀᴏᴢᴇɴ ᴅᴜᴇ ᴛᴏ ѕᴜѕᴘᴇᴄᴛᴇᴅ ᴄʜᴇᴀᴛɪɴɢ."
    - "&eѕᴛᴀꜰꜰ ᴍᴇᴍʙᴇʀѕ ᴡɪʟʟ ᴄᴏɴᴛᴀᴄᴛ ʏᴏᴜ ѕʜᴏʀᴛʟʏ."
    - "&eᴛᴏ ᴄᴏɴꜰᴇѕѕ: ᴛʏᴘᴇ &e/confess"
    - "&e&lᴡᴀʀɴɪɴɢ: &cʟᴇᴀᴠɪɴɢ ᴛʜᴇ ѕᴇʀᴠᴇʀ ᴍᴀʏ ʀᴇѕᴜʟᴛ ɪɴ ᴀ ʙᴀɴ!"
    - "&7----------------------------------------"

  finish-title:
    title: "&#B499DD&lɪɴѕᴘᴇᴄᴛɪᴏɴ ꜰɪɴɪѕʜᴇᴅ"
    subtitle: "&fɪɴѕᴘᴇᴄᴛɪᴏɴ ᴄᴏᴍᴘʟᴇᴛᴇᴅ, ᴇɴᴊᴏʏ ᴛʜᴇ ɢᴀᴍᴇ"
    fade-in: 10
    stay: 60
    fade-out: 20

  finish-message: "&aʏᴏᴜʀ ɪɴѕᴘᴇᴄᴛɪᴏɴ ʜᴀѕ ᴇɴᴅᴇᴅ. ʜᴀᴠᴇ ꜰᴜɴ!"
  command-blocked: "&cʏᴏᴜ ᴄᴀɴɴᴏᴛ ᴜѕᴇ ᴄᴏᴍᴍᴀɴᴅѕ ᴅᴜʀɪɴɢ ɪɴѕᴘᴇᴄᴛɪᴏɴ (ᴏɴʟʏ /confess ɪѕ ᴀʟʟᴏᴡᴇᴅ)!"

# Staff Notifications
staff-notifications:
  start-title:
    title: "&#B499DD&lɪɴѕᴘᴇᴄᴛɪᴏɴ ѕᴛᴀʀᴛᴇᴅ"
    subtitle: "&#B499DD%player% &fʜᴀѕ ʙᴇᴇɴ ᴛᴀᴋᴇɴ ɪɴᴛᴏ ɪɴѕᴘᴇᴄᴛɪᴏɴ."
    fade-in: 10
    stay: 60
    fade-out: 20

  finish-title:
    title: "&#B499DD&lɪɴѕᴘᴇᴄᴛɪᴏɴ ꜰɪɴɪѕʜᴇᴅ"
    subtitle: "&#B499DD%player%'ѕ &fɪɴѕᴘᴇᴄᴛɪᴏɴ ʜᴀѕ ᴇɴᴅᴇᴅ."
    fade-in: 10
    stay: 60
    fade-out: 20

  player-quit-alert: "&e[ᴡᴀʀɴɪɴɢ] &c%player% &cʟᴇꜰᴛ ᴛʜᴇ ɢᴀᴍᴇ!"

# Confession System Messages
confession:
  player-message: "&eYour confession has been recorded. Staff will consider penalty reduction."
  staff-alert: "&#B499DD[ᴄᴏɴꜰᴇѕѕɪᴏɴ] &f%player% &eʜᴀѕ ᴀᴅᴍɪᴛᴛᴇᴅ ᴛᴏ ᴄʜᴇᴀᴛɪɴɢ!"

